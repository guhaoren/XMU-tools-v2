<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厦大百宝箱 · 工具集散地</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif; }
  body { min-height:100vh; background:linear-gradient(145deg,#e0f2fe,#bae6fd); display:flex; justify-content:center; padding:20px; }
  .box { max-width:900px; width:100%; background:rgba(255,255,255,.9); border-radius:36px; overflow:hidden;
         box-shadow:0 25px 40px -12px rgba(0,65,102,.3); }
  .lid { background:linear-gradient(105deg,#003366,#1a4d7a); color:#fff; padding:22px 32px; display:flex; align-items:center; gap:14px; }
  .lid h1 { font-size:1.8rem; }
  .lid p { font-size:.9rem; opacity:.85; }
  .tabs { display:flex; gap:8px; background:rgba(0,51,102,.06); margin:16px 32px; padding:6px; border-radius:20px; }
  .tab { flex:1; padding:12px; border:none; background:transparent; border-radius:14px; font-size:1rem;
         font-weight:600; color:#2c5f7c; cursor:pointer; }
  .tab.active { background:#fff; color:#003366; box-shadow:0 4px 12px -4px rgba(0,45,75,.25); }
  .panel { display:none; padding:0 32px 32px; }
  .panel.active { display:block; }
  .drop { border:2px dashed #2c7da0; border-radius:24px; padding:32px; text-align:center; cursor:pointer; margin-bottom:20px; transition:background .2s; }
  .drop:hover { background:#eef8ff; }
  .drop.over { background:#d4eefc; border-color:#003366; border-style:solid; }
  .drop h2 { color:#003153; margin-bottom:8px; }
  .drop p { color:#2c5f7c; margin-bottom:12px; }
  .btn { background:#003366; color:#fff; padding:12px 32px; border:none; border-radius:40px;
         font-size:1rem; font-weight:600; cursor:pointer; }
  .btn:hover { background:#002244; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .bar h3 { color:#003153; }
  .badge { background:#e3f0f9; color:#003366; padding:4px 12px; border-radius:30px; font-size:.8rem; font-weight:600; }
  .list { list-style:none; max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .item { display:flex; align-items:center; justify-content:space-between; background:#fff; padding:12px 18px;
          border-radius:18px; border:1px solid #d4e6f2; gap:12px; }
  .info { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .icon { font-size:1.5rem; }
  .name { font-weight:600; color:#002b44; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-size:.75rem; color:#4f7e99; }
  .act { display:flex; gap:6px; }
  .ibtn { background:#eef4f9; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1rem; }
  .ibtn:hover { background:#c9e2f0; }
  .ibtn.del:hover { background:#fde2e2; color:#c0392b; }
  .empty { text-align:center; color:#5f8da8; padding:40px; border:1px dashed #b8d4e7; border-radius:20px; }
  .empty .em { font-size:2.4rem; display:block; margin-bottom:8px; }
  .search { width:100%; padding:12px 18px; border:1px solid #b8d8ec; border-radius:16px; margin-bottom:14px; font-size:.92rem; }
  .search:focus { outline:none; border-color:#2c7da0; box-shadow:0 0 0 3px rgba(44,125,160,.15); }
  .modal { position:fixed; inset:0; background:rgba(0,30,50,.6); display:none; align-items:center; justify-content:center; z-index:999; padding:20px; }
  .modal.on { display:flex; }
  .card { background:#fff; border-radius:24px; max-width:680px; width:100%; max-height:85vh; overflow:hidden; display:flex; flex-direction:column; }
  .chead { background:linear-gradient(105deg,#003366,#1a4d7a); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .chead b { font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .x { background:rgba(255,255,255,.2); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1.1rem; flex-shrink:0; }
  .x:hover { background:rgba(255,255,255,.35); }
  .cbody { padding:20px 24px; overflow-y:auto; }
  .preview { min-height:200px; background:#f4f9fd; border-radius:16px; margin-bottom:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .preview img, .preview video { max-width:100%; max-height:60vh; object-fit:contain; }
  .preview iframe { width:100%; height:60vh; border:none; }
  .preview pre { width:100%; max-height:60vh; overflow:auto; padding:16px; background:#1e2d3d; color:#e6f1ff; font-family:monospace; font-size:.85rem; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .preview audio { width:90%; }
  .ph { color:#5f8da8; text-align:center; padding:40px; }
  .ph span { font-size:3rem; display:block; margin-bottom:10px; }
  .minfo { background:#f4f9fd; border-radius:14px; padding:14px 18px; font-size:.85rem; color:#2c5f7c; }
  .minfo div { display:flex; justify-content:space-between; padding:4px 0; gap:16px; }
  .minfo .lbl { color:#5f8da8; flex-shrink:0; }
  .minfo .val { color:#003153; font-weight:600; word-break:break-all; text-align:right; max-width:60%; }
  .mact { margin-top:14px; display:flex; gap:10px; }
  .mact .btn { flex:1; text-align:center; }
  .mact .close2 { background:#6b8ba3; }
  .mact .close2:hover { background:#5a7a92; }
  .foot { text-align:center; font-size:.75rem; color:#4f7e99; padding:16px; border-top:1px solid #e0eef6; }
  @media(max-width:600px){
    .box { border-radius:24px; }
    .lid h1 { font-size:1.4rem; }
    .tabs, .panel { margin-left:16px; margin-right:16px; padding-left:0; padding-right:0; }
    .drop { padding:24px 12px; }
    .minfo div { flex-direction:column; gap:2px; }
    .minfo .val { text-align:left; max-width:100%; }
  }
</style>
</head>
<body>

<div class="box">
  <div class="lid">
    <div style="font-size:2.2rem">🏛️</div>
    <div>
      <h1>厦大百宝箱</h1>
      <p>⚓ XMU Treasure Box · 工具集散地</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="upload">📤 上传文件</button>
    <button class="tab" data-tab="browse">📚 查看文件</button>
  </div>

  <!-- 上传面板 -->
  <div class="panel active" id="panel-upload">
    <div class="drop" id="drop">
      <div style="font-size:3rem">📤</div>
      <h2>拖拽文件到此处</h2>
      <p>或点击下方按钮选择文件（支持多选）</p>
      <button class="btn" id="pickBtn">📂 选择文件</button>
      <input type="file" id="fileInput" multiple style="display:none">
    </div>
    <div class="bar">
      <h3>📦 待上传文件</h3>
      <span class="badge" id="pendingCount">0 个文件</span>
    </div>
    <div id="pendingList"></div>
    <div id="submitWrap" style="margin-top:16px; display:none">
      <button class="btn" style="width:100%; padding:14px" id="submitBtn">⚡ 上传到百宝箱</button>
    </div>
  </div>

  <!-- 查看面板 -->
  <div class="panel" id="panel-browse">
    <div class="bar">
      <h3>🗂️ 百宝箱文件库</h3>
      <span class="badge" id="publicCount">0 个文件</span>
    </div>
    <input type="search" class="search" id="search" placeholder="🔍 搜索文件名...">
    <div id="publicList"></div>
  </div>

  <div class="foot">⚓ 厦门大学 · 百宝箱 &nbsp;|&nbsp; 📎 文件存储在本地浏览器 &nbsp;|&nbsp; 👥 所有用户共享</div>
</div>

<!-- 预览弹窗 -->
<div class="modal" id="modal">
  <div class="card">
    <div class="chead">
      <b id="mTitle">文件名</b>
      <button class="x" id="mClose">✕</button>
    </div>
    <div class="cbody">
      <div class="preview" id="mPreview"></div>
      <div class="minfo" id="mInfo"></div>
      <div class="mact" id="mActions"></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ===== 状态 =====
  const pending = new Map();   // 待上传：指纹 -> File
  const library = new Map();   // 公共库：id -> {file, meta}
  let previewId = null;
  let objectUrl = null;
  let token = 0;

  // ===== 元素 =====
  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('fileInput'), pickBtn = $('pickBtn');
  const pendingList = $('pendingList'), pendingCount = $('pendingCount'), submitWrap = $('submitWrap'), submitBtn = $('submitBtn');
  const publicList = $('publicList'), publicCount = $('publicCount'), search = $('search');
  const tabs = document.querySelectorAll('.tab');
  const panels = { upload: $('panel-upload'), browse: $('panel-browse') };
  const modal = $('modal'), mClose = $('mClose'), mTitle = $('mTitle'), mPreview = $('mPreview'), mInfo = $('mInfo'), mActions = $('mActions');

  // ===== 工具函数 =====
  const fp = f => `${f.name}|${f.size}|${f.lastModified}`;
  const size = b => {
    if (b === 0) return '0 B';
    const u = ['B','KB','MB','GB','TB'];
    const i = Math.floor(Math.log(b)/Math.log(1024));
    return (b/Math.pow(1024,i)).toFixed(i?1:0) + ' ' + u[i];
  };
  const time = t => {
    const d = new Date(t), p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  const icon = n => {
    const e = n.split('.').pop()?.toLowerCase() || '';
    if (e === 'pdf') return '📄';
    if (['doc','docx'].includes(e)) return '📝';
    if (['xls','xlsx','csv'].includes(e)) return '📊';
    if (['ppt','pptx'].includes(e)) return '📽️';
    if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(e)) return '🖼️';
    if (['mp4','mov','avi','mkv','webm'].includes(e)) return '🎬';
    if (['mp3','wav','flac','m4a'].includes(e)) return '🎵';
    if (['zip','rar','7z','tar','gz'].includes(e)) return '📦';
    if (['txt','md','json','xml','yaml','yml'].includes(e)) return '📃';
    if (['html','css','js','ts','py','java','c','cpp','go','rs','vue'].includes(e)) return '💻';
    return '📎';
  };
  const cat = n => {
    const e = n.split('.').pop()?.toLowerCase() || '';
    if (['jpg','jpeg','png','gif','webp','svg','bmp'].includes(e)) return 'image';
    if (['mp4','mov','avi','mkv','webm','ogv'].includes(e)) return 'video';
    if (['mp3','wav','flac','m4a','ogg','aac'].includes(e)) return 'audio';
    if (e === 'pdf') return 'pdf';
    if (['txt','md','json','xml','yaml','yml','log','csv'].includes(e)) return 'text';
    if (['html','htm'].includes(e)) return 'html';
    return 'other';
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const release = () => { if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; } };

  // 停止并清空预览区（避免音视频残留播放）
  function clearPreview() {
    const v = mPreview.querySelectorAll('video, audio');
    v.forEach(el => { try { el.pause(); el.removeAttribute('src'); el.load(); } catch(_){} });
    mPreview.innerHTML = '';
  }

  // ===== 标签切换 =====
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.toggle('active', x === t));
    Object.keys(panels).forEach(k => panels[k].classList.toggle('active', k === t.dataset.tab));
    if (t.dataset.tab === 'browse') renderLibrary();
  }));

  // ===== 待上传列表 =====
  function renderPending() {
    pendingList.innerHTML = '';
    const arr = [...pending.values()];
    pendingCount.textContent = arr.length + ' 个文件';
    submitWrap.style.display = arr.length ? 'block' : 'none';

    if (!arr.length) {
      pendingList.innerHTML = '<div class="empty"><span class="em">📭</span>暂无待上传文件，拖拽或选择文件试试</div>';
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';
    arr.forEach(f => {
      const li = document.createElement('li');
      li.className = 'item';
      li.innerHTML = `
        <div class="info">
          <span class="icon">${icon(f.name)}</span>
          <div style="min-width:0">
            <div class="name" title="${esc(f.name)}">${esc(f.name)}</div>
            <div class="meta">📏 ${size(f.size)}</div>
          </div>
        </div>
        <div class="act">
          <button class="ibtn del" data-fp="${fp(f)}" title="移除">✕</button>
        </div>`;
      ul.appendChild(li);
    });
    pendingList.appendChild(ul);
  }

  // 移除待上传
  pendingList.addEventListener('click', e => {
    const b = e.target.closest('[data-fp]');
    if (b && pending.has(b.dataset.fp)) {
      pending.delete(b.dataset.fp);
      renderPending();
    }
  });

  // 添加文件（去重）
  function addFiles(files) {
    if (!files || !files.length) return;
    let added = 0;
    for (const f of files) {
      if (!(f instanceof File)) continue;
      const key = fp(f);
      if (!pending.has(key)) { pending.set(key, f); added++; }
    }
    if (added) renderPending();
  }

  // ===== 文件选择 & 拖拽 =====
  fileInput.addEventListener('change', e => {
    addFiles(e.target.files);
    fileInput.value = '';
  });
  pickBtn.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  drop.addEventListener('click', e => { if (!e.target.closest('button')) fileInput.click(); });

  ['dragenter','dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));

  // 用计数器解决 dragleave 在子元素上触发的闪烁问题
  let dragDepth = 0;
  drop.addEventListener('dragenter', () => {
    dragDepth++;
    drop.classList.add('over');
  });
  drop.addEventListener('dragleave', () => {
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; drop.classList.remove('over'); }
  });
  drop.addEventListener('dragover', () => drop.classList.add('over'));
  drop.addEventListener('drop', e => {
    dragDepth = 0;
    drop.classList.remove('over');
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => e.preventDefault());

  // ===== 提交上传 =====
  submitBtn.addEventListener('click', () => {
    if (!pending.size) return;
    const arr = [...pending.values()];
    pending.clear();
    arr.forEach(f => {
      const id = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '-' + f.name;
      library.set(id, { file: f, meta: { id, name: f.name, size: f.size, type: f.type || '未知', uploadTime: Date.now() } });
    });
    renderPending();
    // 切换到查看面板（用 tabs 数组，避免脆弱选择器）
    const browseTab = [...tabs].find(t => t.dataset.tab === 'browse');
    if (browseTab) browseTab.click();
  });

  // ===== 公共库渲染 =====
  function renderLibrary() {
    publicList.innerHTML = '';
    const kw = search.value.trim().toLowerCase();
    let arr = [...library.values()];
    if (kw) arr = arr.filter(x => x.meta.name.toLowerCase().includes(kw));
    publicCount.textContent = library.size + ' 个文件';

    if (!arr.length) {
      publicList.innerHTML = kw
        ? `<div class="empty"><span class="em">🔍</span>没有找到匹配「${esc(kw)}」的文件</div>`
        : `<div class="empty"><span class="em">📚</span>百宝箱还是空的，快去上传第一个文件吧～</div>`;
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';
    arr.forEach(({ meta }) => {
      const li = document.createElement('li');
      li.className = 'item';
      li.innerHTML = `
        <div class="info">
          <span class="icon">${icon(meta.name)}</span>
          <div style="min-width:0">
            <div class="name" title="${esc(meta.name)}">${esc(meta.name)}</div>
            <div class="meta">📏 ${size(meta.size)} · 🕒 ${time(meta.uploadTime)}</div>
          </div>
        </div>
        <div class="act">
          <button class="ibtn" data-id="${esc(meta.id)}" data-act="preview" title="预览">👁️</button>
          <button class="ibtn" data-id="${esc(meta.id)}" data-act="download" title="下载">⬇️</button>
        </div>`;
      ul.appendChild(li);
    });
    publicList.appendChild(ul);
  }

  // 公共库事件委托
  publicList.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id;
    if (!id || !library.has(id)) return;
    if (b.dataset.act === 'preview') openPreview(id);
    else if (b.dataset.act === 'download') download(id);
  });

  // ===== 预览 =====
  function openPreview(id) {
    const item = library.get(id);
    if (!item) return;

    // 释放上一个 blob URL 并清空预览（停掉音视频）
    release();
    clearPreview();
    previewId = id;
    const my = ++token;
    const { file, meta } = item;
    const c = cat(meta.name);

    mTitle.textContent = meta.name;
    let url = null;

    if (c === 'image') {
      url = URL.createObjectURL(file); objectUrl = url;
      const img = document.createElement('img');
      img.src = url; img.alt = meta.name;
      mPreview.appendChild(img);
    } else if (c === 'video') {
      url = URL.createObjectURL(file); objectUrl = url;
      const v = document.createElement('video');
      v.src = url; v.controls = true;
      mPreview.appendChild(v);
    } else if (c === 'audio') {
      url = URL.createObjectURL(file); objectUrl = url;
      const a = document.createElement('audio');
      a.src = url; a.controls = true;
      mPreview.appendChild(a);
    } else if (c === 'pdf') {
      url = URL.createObjectURL(file); objectUrl = url;
      const ifr = document.createElement('iframe');
      ifr.src = url; ifr.title = meta.name;
      mPreview.appendChild(ifr);
    } else if (c === 'html' || c === 'text') {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = `<span>⏳</span>正在加载…`;
      mPreview.appendChild(ph);

      const reader = new FileReader();
      reader.onload = ev => {
        // 竞态保护：切换/关闭后不写入
        if (my !== token || !modal.classList.contains('on')) return;
        clearPreview();
        if (c === 'html') {
          const ifr = document.createElement('iframe');
          ifr.setAttribute('sandbox', '');   // 完全沙箱，禁脚本，防 XSS
          ifr.srcdoc = ev.target.result;
          mPreview.appendChild(ifr);
        } else {
          const pre = document.createElement('pre');
          pre.textContent = ev.target.result;
          mPreview.appendChild(pre);
        }
      };
      reader.onerror = () => {
        if (my !== token) return;
        mPreview.innerHTML = `<div class="ph"><span>⚠️</span>读取失败</div>`;
      };
      reader.readAsText(file);
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.innerHTML = `<span>${icon(meta.name)}</span>该类型暂不支持预览<br><small>可下载后查看</small>`;
      mPreview.appendChild(ph);
    }

    // 信息
    mInfo.innerHTML = `
      <div><span class="lbl">文件名</span><span class="val">${esc(meta.name)}</span></div>
      <div><span class="lbl">大小</span><span class="val">${size(meta.size)}</span></div>
      <div><span class="lbl">类型</span><span class="val">${esc(meta.type)}</span></div>
      <div><span class="lbl">上传时间</span><span class="val">${time(meta.uploadTime)}</span></div>`;

    // 操作按钮
    mActions.innerHTML = '';
    const dl = document.createElement('button');
    dl.className = 'btn'; dl.textContent = '⬇️ 下载文件';
    dl.addEventListener('click', () => download(id));

    const cl = document.createElement('button');
    cl.className = 'btn close2'; cl.textContent = '✕ 关闭';
    cl.addEventListener('click', closeModal);

    mActions.appendChild(dl);
    mActions.appendChild(cl);

    modal.classList.add('on');
  }

  // ===== 下载 =====
  function download(id) {
    const item = library.get(id);
    if (!item) return;
    const url = URL.createObjectURL(item.file);
    const a = document.createElement('a');
    a.href = url; a.download = item.meta.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ===== 关闭弹窗 =====
  function closeModal() {
    modal.classList.remove('on');
    clearPreview();
    release();
    previewId = null;
  }
  mClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('on')) closeModal(); });

  // ===== 搜索 =====
  search.addEventListener('input', renderLibrary);

  // ===== 初始化 =====
  renderPending();
  renderLibrary();
})();
</script>
</body>
</html>
